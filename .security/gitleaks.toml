title = "Reviewed default Gitleaks rules"
[extend]
useDefault = true
# No blanket allowlist or baseline. Review narrowly scoped exceptions explicitly.

# Reviewed 2026-11-09; owner @tuliosoria; review due 2027-02-07.
# This exact value is a browser disclaimer localStorage slot, verified at getItem/setItem.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Exact reviewed disclaimer storage slot, not a service credential"
condition = "AND"
paths = ['''(^|/)src/components/layout/first-visit-disclaimer\.tsx$''']
regexTarget = "secret"
regexes = ['''^ccf\.disclaimer\.v1$''']
